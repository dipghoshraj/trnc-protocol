[package]
name = "transport"
version = "0.1.0"
edition = "2024"
description = "Binary framing and TCP connection layer for TrenchDB"
documentation = "https://docs.rs/transport"
readme = "README.md"
keywords = ["transport", "tcp", "framing", "async", "database"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = "1.11.1"
tokio = { version = "1.52.3", features = ["io-util", "net"] }
byteser = "0.1.1"
byteser_derive = "0.1.0"
async-trait = "0.1.68"
rustls = "0.23.43"
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
x509-parser = "0.18.1"
uuid = { version = "1.28.0", features = ["v4"] }
aws-lc-rs = "1.18.1"
rcgen = { version = "0.14.10", features = ["aws_lc_rs"] }

[dev-dependencies]
# These extra features are only needed for examples / integration tests.
# Cargo merges them with [dependencies], so the library itself stays minimal.
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread", "macros"] }
