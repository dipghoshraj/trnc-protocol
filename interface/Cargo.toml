[package]
name = "interface"
version = "0.1.0"
edition = "2021"
description = "Interface for testing the transport protocol"

[dependencies]
transport = { path = "../transport" }
tokio = { version = "1.52.3", features = ["full"] }
byteser = "0.1.1"
byteser_derive = "0.1.0"
async-trait = "0.1.68"
clap = { version = "4.4", features = ["derive"] }
rustls = "0.23.46"
tokio-rustls = "0.26.6"
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"
sha2 = "0.11.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dev-dependencies]
rcgen = "0.14.10"
transport = { path = "../transport", features = ["test-support"] }
